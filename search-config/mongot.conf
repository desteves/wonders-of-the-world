syncSource:
  replicaSet:
    hostAndPort: "mongo:27777"
    username: mongotUser
    passwordFile: /mongot-community/pwfile
    authSource: admin
    tls: false
    readPreference: primaryPreferred

storage:
  dataPath: "/data/mongot"

server:
  grpc:
    address: "search:27028"
    tls:
      mode: "disabled"

metrics:
  enabled: true
  address: "search:9946"

healthCheck:
  address: "search:8080"

logging:
  verbosity: INFO
